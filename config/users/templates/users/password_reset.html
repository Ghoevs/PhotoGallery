{% extends 'dogs/index.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-4">
        <div class="card photo-card">
            <div class="card-body p-5">
                <h3 class="text-center mb-4">Сброс пароля</h3>
                <p class="text-muted text-center">Введите email, и мы отправим инструкцию по сбросу пароля.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Отправить</button>
                </form>
                <p class="text-center mt-3">
                    <a href="{% url 'users:login' %}">Вернуться ко входу</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
