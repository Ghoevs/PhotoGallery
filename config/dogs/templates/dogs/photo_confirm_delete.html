{% extends 'dogs/index.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card photo-card">
            <div class="card-body text-center py-5">
                <i class="bi bi-trash text-danger" style="font-size: 48px;"></i>
                <h3 class="mt-3">Удалить фотографию?</h3>
                <p class="text-muted">Вы уверены, что хотите удалить "{{ photo.title }}"?</p>
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Удалить</button>
                    <a href="{% url 'dogs:photo_list' %}" class="btn btn-outline-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
