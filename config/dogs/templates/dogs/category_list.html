{% extends 'dogs/index.html' %}
{% block content %}
<h2 class="mb-4">Категории</h2>

<form method="get" class="row g-3 mb-4">
    <div class="col-md-6">
        <div class="input-group">
            <input type="text" name="q" class="form-control" placeholder="Поиск категории..." value="{{ search_query }}">
            <button type="submit" class="btn btn-primary">Искать</button>
        </div>
    </div>
</form>

<div class="row">
    {% for category in categories %}
        <div class="col-md-4 mb-4">
            <div class="card photo-card text-center p-4">
                <div class="card-body">
                    <i class="bi bi-folder-fill text-primary" style="font-size: 48px;"></i>
                    <h5 class="card-title mt-3">{{ category.name }}</h5>
                    <p class="text-muted">{{ category.description }}</p>
                    <a href="{% url 'dogs:photo_list' %}?category={{ category.id }}" class="btn btn-outline-primary">
                        Смотреть фото
                    </a>
                </div>
            </div>
        </div>
    {% empty %}
        <div class="alert alert-info">Категорий не найдено.</div>
    {% endfor %}
</div>
{% endblock %}
